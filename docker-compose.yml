services:
  photo-validator:
    build:
      context: ./photo-validator
      dockerfile: Dockerfile
    container_name: photo-validator
    volumes:
      - ./photo-validator/models:/app/models
    restart: unless-stopped
    networks:
      - match-flow
    ports:
      - "9000:9000"
  db:
    image: postgis/postgis
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

networks:
  match-flow:
    driver: bridge

